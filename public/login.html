<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — EmyFlix WA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at top right, #1a2235, #0a0e1a);
        }
        .auth-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }
        .auth-box {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .auth-header .logo-icon {
            margin: 0 auto 12px;
        }
        .auth-tabs {
            display: flex;
            margin-bottom: 20px;
            background: var(--bg3);
            border-radius: 10px;
            padding: 4px;
            border: 1px solid var(--border);
        }
        .auth-tab {
            flex: 1;
            padding: 8px;
            text-align: center;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text2);
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            background: transparent;
        }
        .auth-tab.active {
            background: var(--primary-glow);
            color: var(--primary);
            border: 1px solid rgba(37, 211, 102, 0.3);
        }
        .auth-form {
            display: none;
        }
        .auth-form.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <div class="logo-icon">💬</div>
                <h1 style="font-size: 22px; font-weight: 700; color: #fff;">EmyFlix WA</h1>
                <p style="font-size: 13px; color: var(--text2); margin-top: 4px;">Gerenciador e Agendador de Mensagens</p>
            </div>

            <div class="auth-tabs">
                <button type="button" class="auth-tab active" onclick="switchAuthTab('login')">Entrar</button>
                <button type="button" class="auth-tab" onclick="switchAuthTab('register')">Cadastrar</button>
            </div>

            <!-- LOGIN -->
            <form id="login-form" class="auth-form active" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="login-email" placeholder="seu@email.com" required>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary btn-large" style="width: 100%; margin-top: 10px;" id="login-btn">Entrar</button>
            </form>

            <!-- CADASTRO -->
            <form id="register-form" class="auth-form" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" id="reg-name" placeholder="Seu Nome" required minlength="2" maxlength="50">
                </div>
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="reg-email" placeholder="seu@email.com" required>
                </div>
                <div class="form-group">
                    <label>Senha (mínimo 8 caracteres)</label>
                    <input type="password" id="reg-password" placeholder="Mínimo 8 caracteres" required minlength="8">
                </div>
                <div class="form-group">
                    <label id="captcha-label">Verificação de Segurança</label>
                    <input type="text" id="reg-captcha" placeholder="Resultado da soma" required>
                </div>
                <button type="submit" class="btn btn-primary btn-large" style="width: 100%; margin-top: 10px;" id="reg-btn">Criar Conta Grátis</button>
            </form>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        let num1 = 0, num2 = 0;
        function generateCaptcha() {
            num1 = Math.floor(Math.random() * 8) + 2;
            num2 = Math.floor(Math.random() * 8) + 1;
            document.getElementById('captcha-label').textContent = `Quanto é ${num1} + ${num2}?`;
            document.getElementById('reg-captcha').value = '';
        }

        function switchAuthTab(tab) {
            document.querySelectorAll('.auth-tab').forEach((t, i) => {
                t.classList.toggle('active', (tab === 'login' && i === 0) || (tab === 'register' && i === 1));
            });
            document.getElementById('login-form').classList.toggle('active', tab === 'login');
            document.getElementById('register-form').classList.toggle('active', tab === 'register');
            if (tab === 'register') generateCaptcha();
        }

        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `toast ${type} show`;
            setTimeout(() => t.className = 'toast', 3500);
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('login-btn');
            btn.disabled = true;
            btn.textContent = 'Entrando...';

            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok && data.token) {
                    localStorage.setItem('wa_token', data.token);
                    localStorage.setItem('wa_user', JSON.stringify(data.user));
                    showToast('✅ Login realizado com sucesso!', 'success');
                    setTimeout(() => {
                        window.location.href = data.user?.role === 'admin' ? '/admin.html' : '/index.html';
                    }, 800);
                } else {
                    showToast(data.error || 'Erro ao efetuar login', 'error');
                }
            } catch (err) {
                showToast('Erro de conexão com o servidor', 'error');
            }
            btn.disabled = false;
            btn.textContent = 'Entrar';
        }

        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;
            const captcha = document.getElementById('reg-captcha').value.trim();

            if (parseInt(captcha) !== (num1 + num2)) {
                showToast('Resposta de segurança incorreta!', 'error');
                generateCaptcha();
                return;
            }

            const btn = document.getElementById('reg-btn');
            btn.disabled = true;
            btn.textContent = 'Criando conta...';

            try {
                const res = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, captcha })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    localStorage.setItem('wa_token', data.token);
                    localStorage.setItem('wa_user', JSON.stringify(data.user));
                    showToast('🎉 Conta criada com sucesso!', 'success');
                    setTimeout(() => { window.location.href = '/index.html'; }, 900);
                } else {
                    showToast(data.error || 'Erro ao realizar cadastro', 'error');
                    generateCaptcha();
                }
            } catch (err) {
                showToast('Erro de conexão ao cadastrar', 'error');
                generateCaptcha();
            }
            btn.disabled = false;
            btn.textContent = 'Criar Conta Grátis';
        }

        // Se já tiver token válido salvo, redireciona
        if (localStorage.getItem('wa_token')) {
            const user = JSON.parse(localStorage.getItem('wa_user') || '{}');
            window.location.href = user.role === 'admin' ? '/admin.html' : '/index.html';
        }
    </script>
</body>
</html>
