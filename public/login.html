<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EmyFlix WA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background blobs */
        .blob {
            position: absolute;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.5;
            animation: float 10s infinite ease-in-out alternate;
        }
        .blob-1 { top: -10%; left: 10%; width: 500px; height: 500px; background: radial-gradient(circle, #4f46e5 0%, transparent 70%); }
        .blob-2 { bottom: -10%; right: 10%; width: 400px; height: 400px; background: radial-gradient(circle, #0ea5e9 0%, transparent 70%); animation-delay: -5s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 30px) scale(1.1); }
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            z-index: 10;
        }

        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.5s ease-out;
            position: relative;
            overflow: hidden;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        input {
            width: 100%;
            padding: 0.875rem 1rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
        }

        .btn-primary {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--primary), #3b82f6);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 1rem;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .toggle-text {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .toggle-text a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
            cursor: pointer;
        }

        .toggle-text a:hover {
            color: #93c5fd;
        }

        /* Toast notification */
        .toast {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #ef4444;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            font-weight: 500;
            font-size: 0.875rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 100;
            white-space: nowrap;
        }
        .toast.success { background: #10b981; }
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* Panels */
        #register-panel { display: none; }
        
        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div id="toast" class="toast">Mensagem de erro</div>

    <div class="auth-container">
        <!-- Login Panel -->
        <div id="login-panel" class="glass-panel">
            <div class="logo">EmyFlix WA</div>
            <form id="login-form">
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="login-email" placeholder="seu@email.com" required>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary" id="login-btn">
                    <span class="btn-text">Entrar</span>
                    <div class="loader"></div>
                </button>
            </form>
            <div class="toggle-text">
                Não tem uma conta? <a onclick="togglePanels()">Criar conta</a>
            </div>
        </div>

        <!-- Register Panel -->
        <div id="register-panel" class="glass-panel">
            <div class="logo">Criar Conta</div>
            <form id="register-form">
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" id="reg-name" placeholder="João Silva" required>
                </div>
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="reg-email" placeholder="seu@email.com" required>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="reg-password" placeholder="Mínimo 8 caracteres" minlength="8" required>
                </div>
                <div class="form-group">
                    <label>Verificação (Quanto é 3 + 4?)</label>
                    <input type="text" id="reg-captcha" placeholder="Digite a resposta (7)" required>
                </div>
                <button type="submit" class="btn-primary" id="reg-btn">
                    <span class="btn-text">Cadastrar</span>
                    <div class="loader"></div>
                </button>
            </form>
            <div class="toggle-text">
                Já tem conta? <a onclick="togglePanels()">Fazer login</a>
            </div>
        </div>
    </div>

    <script>
        const loginPanel = document.getElementById('login-panel');
        const registerPanel = document.getElementById('register-panel');
        const toast = document.getElementById('toast');

        // Check if already logged in
        if (localStorage.getItem('token')) {
            window.location.href = '/admin.html';
        }

        function togglePanels() {
            if (loginPanel.style.display === 'none') {
                registerPanel.style.display = 'none';
                loginPanel.style.display = 'block';
            } else {
                loginPanel.style.display = 'none';
                registerPanel.style.display = 'block';
            }
        }

        function showToast(msg, isSuccess = false) {
            toast.textContent = msg;
            toast.className = 'toast show ' + (isSuccess ? 'success' : '');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        function setLoading(btnId, isLoading) {
            const btn = document.getElementById(btnId);
            const text = btn.querySelector('.btn-text');
            const loader = btn.querySelector('.loader');
            if (isLoading) {
                text.style.display = 'none';
                loader.style.display = 'block';
                btn.disabled = true;
            } else {
                text.style.display = 'block';
                loader.style.display = 'none';
                btn.disabled = false;
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            
            setLoading('login-btn', true);
            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                
                if (!res.ok) {
                    showToast(data.error || 'Erro ao fazer login');
                } else {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showToast('Login com sucesso!', true);
                    setTimeout(() => { window.location.href = '/admin.html'; }, 1000);
                }
            } catch (err) {
                showToast('Erro de conexão com o servidor');
            }
            setLoading('login-btn', false);
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const captcha = document.getElementById('reg-captcha').value;

            if (captcha.trim() !== '7') {
                showToast('Verificação incorreta! A resposta é 7.');
                return;
            }

            setLoading('reg-btn', true);
            try {
                const res = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, captcha })
                });
                const data = await res.json();
                
                if (!res.ok) {
                    showToast(data.error || 'Erro ao cadastrar');
                } else {
                    showToast('Cadastro realizado! Aguardando aprovação.', true);
                    setTimeout(() => { togglePanels(); }, 2000);
                }
            } catch (err) {
                showToast('Erro de conexão com o servidor');
            }
            setLoading('reg-btn', false);
        });
    </script>
</body>
</html>
